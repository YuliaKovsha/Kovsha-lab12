<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Реєстрація</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top-bar">
    <div class="logo">
        <h1>Мій особистий блог</h1>
        <span>Ковша Юлія Володимирівна</span>
    </div>
    <nav class="auth-links">
        <a href="#">Вхід</a>
        <a href="KovshaLab10-1.htm">Реєстрація</a>
    </nav>
</header>

<main>
    <div class="register-container">
        <div class="reg-header">Реєстрація користувача</div>
        <form action="#" method="post">

            <div class="form-group">
                <label>Прізвище</label>
                <input type="text" name="lastname" required>
            </div>

            <div class="form-group">
                <label>Ім'я</label>
                <input type="text" name="firstname" required>
            </div>

            <div class="form-group">
                <label>Логін</label>
                <input type="text" name="login" required>
            </div>

            <div class="form-group">
                <label>Навчальна група</label>
                <select name="group">
                    <option value="304-ТН">304-ТН</option>
                    <option value="301-ТН">301-ТН</option>
                </select>
            </div>

            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" required>
            </div>

            <div class="form-group">
                <label>Підтвердження паролю</label>
                <input type="password" name="confirm_password" required>
            </div>

            <button type="submit" class="submit-btn">Зареєструватись</button>
        </form>
    </div>
</main>

<footer class="footer">
    <p>&copy; Всі права захищені.</p>
</footer>

</body>
</html>
